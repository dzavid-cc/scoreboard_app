<html>
  <head>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <h3>HOME</h3>
        <div class="result">
          <p id="scoreHome" class="scoreDeco">0</p>
        </div>
        <div class="buttons">
          <button onclick="addOne()" class="btn">+1</button>
          <button onclick="addTwo()" class="btn">+2</button>
          <button onclick="addThree()" class="btn">+3</button>
        </div>
      </div>
      <div>
        <button onclick="resetScore()" class="btnReset">Reset score</button>
      </div>
      <div>
        <h3>AWAY</h3>
        <div class="result">
          <p id="scoreGuest" class="scoreDeco">0</p>
        </div>
        <div class="buttons">
          <button onclick="addOneGuest()" class="btn">+1</button>
          <button onclick="addTwoGuest()" class="btn">+2</button>
          <button onclick="addThreeGuest()" class="btn">+3</button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
